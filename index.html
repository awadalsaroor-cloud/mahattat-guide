<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>محطات من الذاكرة — الدليل التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1E6C9;
    --paper-deep:#E7D8AF;
    --ink:#3A2A18;
    --ink-soft:#5C4630;
    --brown:#5C3A21;
    --brown-deep:#3E2712;
    --gold:#B8863C;
    --gold-light:#D9B876;
    --red:#8C2F2A;
    --green:#3F5B3C;
    --shadow: 0 10px 30px rgba(40,25,10,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--brown-deep);}
  body{
    font-family:'Tajawal',sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity .45s ease;
  }
  .screen.active{opacity:1; pointer-events:auto;}

  /* ---------- Paper texture background ---------- */
  .paper-bg{
    background:
      radial-gradient(circle at 15% 20%, rgba(184,134,60,.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(140,47,42,.08), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(92,58,33,.05), transparent 60%),
      var(--paper);
    background-color:var(--paper);
  }

  /* ============ SCREEN 1: COVER ============ */
  #screen-cover{
    align-items:center; justify-content:center;
    background:#1c1108;
    cursor:pointer;
  }
  .cover-wrap{
    position:relative; height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .cover-wrap img{
    height:100%; width:auto; max-width:100%;
    object-fit:contain;
    box-shadow:0 0 80px rgba(0,0,0,.6);
  }
  .tap-hint{
    position:absolute; bottom:5%; left:50%; transform:translateX(-50%);
    color:#F1E6C9; font-family:'Tajawal',sans-serif; font-weight:700;
    font-size:15px; letter-spacing:1px;
    background:rgba(20,12,5,.55);
    padding:10px 28px; border-radius:30px;
    border:1px solid rgba(217,184,118,.5);
    animation:pulse 2.2s ease-in-out infinite;
    backdrop-filter:blur(2px);
  }
  @keyframes pulse{
    0%,100%{opacity:.65; transform:translateX(-50%) translateY(0);}
    50%{opacity:1; transform:translateX(-50%) translateY(-4px);}
  }

  /* ============ SCREEN 2: MAIN MENU (12 icons) ============ */
  #screen-menu{ position:relative; }
  .menu-header{
    text-align:center; padding:28px 20px 10px;
    flex-shrink:0; position:relative;
  }
  .menu-header .eyebrow{
    font-size:12px; letter-spacing:4px; color:var(--gold);
    font-weight:700; text-transform:uppercase;
  }
  .menu-header h1{
    font-family:'Aref Ruqaa', serif; font-weight:700;
    font-size:34px; color:var(--brown-deep); margin:4px 0 2px;
  }
  .menu-header .divider{
    width:90px; height:3px; margin:10px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .back-btn-light{
    position:absolute; top:18px; left:16px; z-index:6;
    width:42px; height:42px; border-radius:50%;
    background:rgba(92,58,33,.08);
    border:1.5px solid var(--brown);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s;
  }
  .back-btn-light:active{ background:rgba(92,58,33,.2); }
  .back-btn-light svg{ width:20px; height:20px; stroke:var(--brown); fill:none; stroke-width:2.2; }
  .menu-scroll{
    flex:1; overflow-y:auto; padding:20px 18px 40px;
  }
  .medallion-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:22px 16px;
    max-width:920px; margin:0 auto;
  }
  .medallion{
    display:flex; flex-direction:column; align-items:center;
    cursor:pointer; text-align:center;
    padding:10px 6px 4px;
    border-radius:16px;
    transition:transform .2s ease;
  }
  .medallion:active{transform:scale(.94);}
  .medallion-badge{
    width:84px; height:84px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6b4a2c, var(--brown-deep) 75%);
    border:3px solid var(--gold);
    box-shadow:0 6px 16px rgba(60,35,10,.35), inset 0 0 0 3px rgba(217,184,118,.25);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    margin-bottom:10px;
  }
  .medallion-badge::before{
    content:''; position:absolute; inset:6px; border-radius:50%;
    border:1px dashed rgba(217,184,118,.55);
  }
  .medallion-badge svg{ width:36px; height:36px; stroke:var(--gold-light); fill:none; stroke-width:1.6; position:relative; z-index:1;}
  .medallion-title{
    font-family:'Aref Ruqaa', serif; font-weight:700;
    font-size:20px; color:var(--brown-deep); line-height:1.3;
  }
  .medallion-sub{
    font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.4;
  }

  /* ============ SCREEN 3: SUBTITLES LIST ============ */
  .sub-header{
    flex-shrink:0; padding:18px 16px 16px 64px;
    background:linear-gradient(180deg, var(--brown-deep), var(--brown));
    display:flex; align-items:center; gap:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    position:relative;
  }
  .back-btn{
    width:42px; height:42px; border-radius:50%;
    background:rgba(217,184,118,.15);
    border:1.5px solid var(--gold-light);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:background .15s;
    position:absolute; top:16px; left:16px; z-index:6;
  }
  .back-btn:active{background:rgba(217,184,118,.35);}
  .back-btn svg{width:20px; height:20px; stroke:var(--gold-light); fill:none; stroke-width:2.2;}
  .sub-header-text{flex:1; min-width:0;}
  .sub-header-text .eyebrow{
    font-size:11px; color:var(--gold-light); letter-spacing:2px; font-weight:700;
  }
  .sub-header-text h2{
    font-family:'Aref Ruqaa', serif; font-weight:700; font-size:22px;
    color:#F1E6C9; margin:2px 0 0;
  }
  .list-scroll{ flex:1; overflow-y:auto; padding:14px 16px 40px;}
  .toc-list{ max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:10px;}
  .toc-item{
    display:flex; align-items:center; gap:14px;
    background:#fff9ec; border:1px solid rgba(92,58,33,.15);
    border-radius:12px; padding:14px 16px;
    cursor:pointer; box-shadow:0 2px 6px rgba(60,35,10,.06);
    transition:transform .15s, box-shadow .15s;
  }
  .toc-item:active{ transform:scale(.98); background:#f4ead0;}
  .toc-num{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:var(--paper-deep); border:1.5px solid var(--gold);
    color:var(--brown-deep); font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .toc-title{ flex:1; font-size:15.5px; font-weight:500; color:var(--ink); line-height:1.4;}
  .toc-arrow{ width:16px; height:16px; stroke:var(--gold); fill:none; stroke-width:2.4; flex-shrink:0; transform:scaleX(-1);}

  /* ============ SCREEN 4: READER ============ */
  #screen-reader{ background:#241608; }
  .reader-header{
    flex-shrink:0; padding:14px 16px 14px 64px; display:flex; align-items:center; gap:14px;
    background:linear-gradient(180deg, var(--brown-deep), #2c1b0d);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    z-index:5; position:relative;
  }
  .reader-title{
    flex:1; min-width:0; color:#F1E6C9; font-family:'Aref Ruqaa',serif;
    font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .page-counter{
    font-size:12px; color:var(--gold-light); font-weight:700; flex-shrink:0;
    background:rgba(217,184,118,.12); padding:5px 12px; border-radius:20px;
    border:1px solid rgba(217,184,118,.3);
    direction:ltr; unicode-bidi:isolate;
  }
  .reader-body{
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    touch-action:pan-y;
  }
  .reader-img-wrap{
    height:100%; width:100%; display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:10px;
  }
  .reader-img-wrap img{
    max-height:100%; max-width:100%; object-fit:contain;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    border-radius:3px;
    background:#fff;
  }
  .reader-nav{
    flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:26px;
    padding:14px 16px 22px;
    background:linear-gradient(0deg, var(--brown-deep), rgba(46,28,13,0));
  }
  .nav-btn{
    width:52px; height:52px; border-radius:50%;
    background:var(--gold); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.35);
    transition:opacity .15s, transform .15s;
  }
  .nav-btn:active{ transform:scale(.92); }
  .nav-btn:disabled{ opacity:.3; pointer-events:none; }
  .nav-btn svg{ width:22px; height:22px; stroke:#2c1b0d; fill:none; stroke-width:2.6;}
  .nav-btn.next svg{ transform:scaleX(-1); }

  /* scrollbars */
  .list-scroll::-webkit-scrollbar, .menu-scroll::-webkit-scrollbar{width:6px;}
  .list-scroll::-webkit-scrollbar-thumb, .menu-scroll::-webkit-scrollbar-thumb{background:rgba(92,58,33,.3); border-radius:10px;}

  @media (max-width:480px){
    .menu-header h1{font-size:26px;}
    .medallion-badge{width:72px; height:72px;}
    .medallion-badge svg{width:30px; height:30px;}
    .medallion-title{font-size:17px;}
  }
</style>
</head>
<body>

  <!-- SCREEN 1: COVER -->
  <div id="screen-cover" class="screen active">
    <div class="cover-wrap">
      <img src="assets/cover.jpg" alt="غلاف الكتاب">
      <div class="tap-hint">المس الغلاف للدخول ‹</div>
    </div>
  </div>

  <!-- SCREEN 2: MAIN MENU -->
  <div id="screen-menu" class="screen paper-bg">
    <div class="menu-header">
      <div class="back-btn-light" id="back-to-cover">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="eyebrow">محطات من الذاكرة</div>
      <h1>فهرس أبواب الكتاب</h1>
      <div class="divider"></div>
    </div>
    <div class="menu-scroll">
      <div class="medallion-grid" id="medallion-grid"></div>
    </div>
  </div>

  <!-- SCREEN 3: SUBTITLES LIST -->
  <div id="screen-list" class="screen paper-bg">
    <div class="sub-header">
      <div class="back-btn" id="back-to-menu">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="sub-header-text">
        <div class="eyebrow" id="list-eyebrow">الباب</div>
        <h2 id="list-title">—</h2>
      </div>
    </div>
    <div class="list-scroll">
      <div class="toc-list" id="toc-list"></div>
    </div>
  </div>

  <!-- SCREEN 4: READER -->
  <div id="screen-reader" class="screen">
    <div class="reader-header">
      <div class="back-btn" id="back-to-list">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="reader-title" id="reader-title">—</div>
      <div class="page-counter" id="page-counter">1 / 1</div>
    </div>
    <div class="reader-body" id="reader-body">
      <div class="reader-img-wrap" id="reader-img-wrap">
        <img id="reader-img" src="" alt="صفحة">
      </div>
    </div>
    <div class="reader-nav">
      <button class="nav-btn next" id="btn-next" aria-label="التالي">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn prev" id="btn-prev" aria-label="السابق">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
